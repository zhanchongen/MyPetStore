<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据冲突 · MyPetStore 管理端</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="error-body">
<main class="error-card">
    <p class="error-code" th:text="${status}">400</p>
    <h1>数据冲突</h1>
    <p th:text="${message}">请求参数不正确，请检查后重试。</p>
    <a class="btn btn--primary" th:href="@{/dashboard}">返回控制台</a>
</main>
</body>
</html>
