<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('订单管理', ~{::content})}">
<body>
<main th:fragment="content" class="page-stack">
    <section class="page-heading">
        <div>
            <p class="eyebrow">ORDERS</p>
            <h2>全站订单</h2>
            <p class="muted">按订单号精确查询或按五状态筛选；按创建时间倒序。管理端不能修改金额、明细或支付凭证。</p>
        </div>
    </section>

    <section class="card filter-card">
        <form method="get" th:action="@{/orders}" class="filter-form">
            <label class="field field--compact">
                <span>订单号</span>
                <input type="text" name="orderNo" maxlength="40" th:value="${orderNo}" placeholder="完整订单号">
            </label>
            <label class="field field--compact">
                <span>状态</span>
                <select name="status">
                    <option value="">全部状态</option>
                    <option th:each="s : ${statusOptions}"
                            th:value="${s.name()}"
                            th:text="${s.label}"
                            th:selected="${status == s.name()}">待支付</option>
                </select>
            </label>
            <div class="filter-actions">
                <button type="submit" class="btn btn--primary btn--sm">查询</button>
                <a class="btn btn--ghost btn--sm" th:href="@{/orders}">重置</a>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="table-meta">
            <span th:text="${'共 ' + pageResult.total() + ' 笔订单'}">共 0 笔订单</span>
            <span class="muted" th:text="${'第 ' + pageResult.fromIndex() + '–' + pageResult.toIndex() + ' 条'}">第 0–0 条</span>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>订单号</th>
                    <th>会员</th>
                    <th>收货人</th>
                    <th class="num">总额</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th class="actions-col">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${pageResult.records()}">
                    <td><code th:text="${row.orderNo}">ORD...</code></td>
                    <td th:text="${'@' + row.username}">@alice</td>
                    <td th:text="${row.receiverName}">收货人</td>
                    <td class="num" th:text="${@money.format(row.totalAmount)}">¥0.00</td>
                    <td>
                        <span class="badge"
                              th:classappend="${'badge--' + #strings.toLowerCase(row.status.name())}"
                              th:text="${row.status.label}">待支付</span>
                    </td>
                    <td th:text="${@fmt.dt(row.createdAt)}">2026-01-01 00:00:00</td>
                    <td class="actions">
                        <a class="btn btn--ghost btn--sm" th:href="@{/orders/{id}(id=${row.id})}">详情</a>
                    </td>
                </tr>
                <tr th:if="${pageResult.isEmpty()}">
                    <td colspan="7" class="empty-cell">没有符合条件的订单。</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/pagination :: pager(${pageLinks})}"></div>
    </section>
</main>
</body>
</html>
