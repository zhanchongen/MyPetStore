spring:
  application:
    name: MyPetStore-SSM
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:MyPetStore}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: MyPetStoreUserPool
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    encoding: UTF-8
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
  mvc:
    hiddenmethod:
      filter:
        enabled: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        name: PETSTORE_USER_SESSION
        http-only: true
        same-site: lax
        path: /
  error:
    whitelabel:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    org.csu.mypetstore: INFO
