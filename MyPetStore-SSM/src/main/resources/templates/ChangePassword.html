<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('profile')}"></header>

<main class="page-section">
    <div class="cart-main">
        <section class="page-section__head">
            <div>
                <span class="eyebrow">CHANGE PASSWORD</span>
                <h1>修改密码</h1>
                <p>修改成功后当前登录会失效，需要使用新密码重新登录。</p>
            </div>
            <a class="btn btn--ghost" th:href="@{/profile}">返回个人资料</a>
        </section>

        <div class="profile-layout">
            <section class="panel">
                <h2>设置新密码</h2>
                <div class="flash flash--error" th:if="${error != null}" th:text="${error}">修改失败</div>
                <form class="form-grid" th:action="@{/profile/password}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <label class="field">
                        <span>当前密码</span>
                        <input type="password" name="oldPassword" autocomplete="current-password" required>
                    </label>
                    <label class="field">
                        <span>新密码</span>
                        <input type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="32" required>
                        <small>8–32 个字符，至少包含字母、数字、符号中的两类，不能含空白字符。</small>
                    </label>
                    <label class="field">
                        <span>确认新密码</span>
                        <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="32" required>
                    </label>
                    <div class="checkout-submit">
                        <button type="submit" class="btn btn--primary">修改密码</button>
                        <a class="btn btn--ghost" th:href="@{/profile}">取消</a>
                    </div>
                </form>
            </section>

            <aside class="panel">
                <h2>安全说明</h2>
                <div class="checkout-note">
                    <p>密码使用 BCrypt 哈希存储，页面和日志不会显示密码明文。</p>
                    <p>本实验不提供找回密码、验证码或第三方登录；如忘记演示账号密码，请重新导入 database 目录中的 02 初始化脚本。</p>
                </div>
            </aside>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
