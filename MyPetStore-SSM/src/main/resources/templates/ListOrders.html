<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的订单')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('orders')}"></header>

<main class="orders-page">
    <div class="orders-main">
        <section class="orders-intro">
            <div>
                <span class="eyebrow">MY ORDERS</span>
                <h1>我的订单</h1>
                <p>按状态筛选，或输入完整订单号精确查找。所有金额均为人民币。</p>
            </div>
            <form class="orders-search" th:action="@{/orders}" method="get">
                <input type="hidden" name="status" th:value="${status}">
                <label for="orderNo">订单号</label>
                <input id="orderNo" type="text" name="orderNo" th:value="${orderNo}" placeholder="输入完整订单号" autocomplete="off">
                <button type="submit" class="btn btn--sm btn--primary">查找</button>
                <a class="btn btn--sm btn--ghost" th:if="${!#strings.isEmpty(orderNo)}" th:href="@{/orders(status=${status})}">清除</a>
            </form>
        </section>

        <nav class="orders-tabs" aria-label="订单状态">
            <a th:href="@{/orders(orderNo=${orderNo})}" th:classappend="${status == 'ALL' ? ' is-active' : ''}">全部</a>
            <a th:each="s : ${statusOptions}" th:href="@{/orders(status=${s.name()}, orderNo=${orderNo})}"
               th:text="${s.label}"
               th:classappend="${status == s.name() ? ' is-active' : ''}">待支付</a>
        </nav>

        <div class="orders-content">
            <div class="orders-list" th:if="${!pageResult.isEmpty()}">
                <article class="order-card" th:each="row : ${pageResult.records()}">
                    <header class="order-card__head">
                        <div>
                            <span>订单号</span>
                            <b th:text="${row.orderNo}">ORDER</b>
                        </div>
                        <span class="order-status" th:classappend="${' order-status--' + #strings.toLowerCase(row.status.name())}"
                              th:text="${row.status.label}">状态</span>
                    </header>
                    <div class="order-card__body">
                        <div class="order-card__summary">
                            <span class="catalog-label">订单摘要</span>
                            <h2 th:text="'共 ' + ${row.itemCount} + ' 件商品'">商品</h2>
                            <p>下单时间：<span th:text="${@fmt.dt(row.createdAt)}">时间</span></p>
                        </div>
                        <div class="order-card__price">
                            <small>订单金额</small>
                            <strong class="money" th:text="${@money.format(row.totalAmount)}">¥0.00</strong>
                        </div>
                        <div class="order-card__actions">
                            <a class="btn btn--sm" th:href="@{/orders/{id}(id=${row.id})}">查看详情</a>
                            <a class="btn btn--sm btn--primary" th:if="${row.status.canPay()}"
                               th:href="@{/payment/{id}(id=${row.id})}">去支付</a>
                        </div>
                    </div>
                </article>
            </div>

            <div class="empty-state" th:if="${pageResult.isEmpty()}">
                <span class="eyebrow">NO ORDERS</span>
                <h2>没有找到订单</h2>
                <p th:if="${!#strings.isEmpty(orderNo)}">没有匹配该订单号的订单，请确认订单号是否完整。</p>
                <p th:if="${#strings.isEmpty(orderNo)}">当前状态下还没有订单。</p>
                <a class="btn btn--primary" th:href="@{/category}">去逛逛商城</a>
            </div>

            <nav class="pager" th:if="${pageResult.pages() > 1}" aria-label="订单分页">
                <a th:if="${pageResult.hasPrevious()}" th:href="${pageLinks.previousUrl()}">上一页</a>
                <span class="is-disabled" th:unless="${pageResult.hasPrevious()}">上一页</span>
                <a th:each="link : ${pageLinks.pages()}" th:href="${link.url()}" th:text="${link.number()}"
                   th:classappend="${link.current() ? ' is-current' : ''}">1</a>
                <a th:if="${pageResult.hasNext()}" th:href="${pageLinks.nextUrl()}">下一页</a>
                <span class="is-disabled" th:unless="${pageResult.hasNext()}">下一页</span>
            </nav>
            <p class="orders-count" th:if="${!pageResult.isEmpty()}">
                共 <b th:text="${pageResult.total()}">0</b> 笔订单，当前显示
                <b th:text="${pageResult.fromIndex()}">1</b>–<b th:text="${pageResult.toIndex()}">10</b>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
