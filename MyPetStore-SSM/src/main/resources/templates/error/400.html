<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>请求有误 | MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/jpetstore.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="error-page">
<main class="error-card">
    <div class="error-card__code" th:text="${status != null ? status : 400}">400</div>
    <h1>请求参数有误</h1>
    <p th:text="${message != null ? message : '请检查地址、页码或筛选条件后重试。'}">请检查参数。</p>
    <div class="error-card__actions">
        <a class="btn btn--primary" th:href="@{/main}">返回首页</a>
        <a class="btn btn--ghost" th:href="@{/category}">去选购</a>
    </div>
</main>
</body>
</html>
