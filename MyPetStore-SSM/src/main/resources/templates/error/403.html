<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>没有权限 | MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/jpetstore.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="error-page">
<main class="error-card">
    <div class="error-card__code" th:text="${status != null ? status : 403}">403</div>
    <h1>没有权限执行此操作</h1>
    <p th:text="${message != null ? message : '请确认已登录，并刷新页面后重新提交。'}">请确认登录状态。</p>
    <div class="error-card__actions">
        <a class="btn btn--primary" th:href="@{/main}">返回首页</a>
        <a class="btn btn--ghost" th:href="@{/login}">重新登录</a>
    </div>
</main>
</body>
</html>
