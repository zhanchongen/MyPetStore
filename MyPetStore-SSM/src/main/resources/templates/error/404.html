<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在 | MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/jpetstore.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="error-page">
<main class="error-card">
    <div class="error-card__code" th:text="${status != null ? status : 404}">404</div>
    <h1>没有找到这个页面</h1>
    <p th:text="${message != null ? message : '商品可能已下架，或链接地址不正确。'}">页面不存在。</p>
    <div class="error-card__actions">
        <a class="btn btn--primary" th:href="@{/main}">返回首页</a>
        <a class="btn btn--ghost" th:href="@{/category}">去选购</a>
    </div>
</main>
</body>
</html>
