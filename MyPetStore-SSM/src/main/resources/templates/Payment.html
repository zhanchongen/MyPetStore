<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('模拟支付')}"></head>
<body class="cart-page">
<div class="mpa-shell cart-shell">
<header th:replace="~{fragments/layout :: header('orders')}"></header>

<main class="cart-main">
    <section class="cart-intro">
        <div>
            <span>MOCK PAYMENT</span>
            <h1>模拟支付</h1>
            <p>请选择本次模拟支付的结果。本页面不接入任何真实支付渠道。</p>
        </div>
        <div class="cart-steps" aria-label="结算步骤">
            <span><b>01</b>购物车</span>
            <i></i>
            <span><b>02</b>确认订单</span>
            <i></i>
            <span class="is-active"><b>03</b>模拟支付</span>
        </div>
    </section>

        <section class="panel payment-card">
            <span class="catalog-label" th:text="${order.status.label}">待支付</span>
            <h2 th:text="'订单 ' + ${order.orderNo}">订单号</h2>
            <p>下单时间：<span th:text="${@fmt.dt(order.createdAt)}">时间</span></p>
            <div class="payment-amount money" th:text="${@money.format(order.totalAmount)}">¥0.00</div>
            <p class="checkout-note">支付结果会立即写入订单状态：成功进入待发货，失败保留待支付并允许重试。</p>

            <div class="payment-actions" th:if="${order.status.canPay()}">
                <form th:action="@{/payment/{id}/success(id=${order.id})}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <button type="submit" class="btn btn--primary">模拟支付成功</button>
                </form>
                <form th:action="@{/payment/{id}/fail(id=${order.id})}" method="post"
                      data-confirm="模拟支付失败后订单仍为待支付，确定继续吗？">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <button type="submit" class="btn btn--danger">模拟支付失败</button>
                </form>
            </div>
            <p class="checkout-note" th:unless="${order.status.canPay()}">
                当前订单状态为「<span th:text="${order.status.label}">状态</span>」，不能再次发起支付。
            </p>

            <div class="payment-actions">
                <a class="btn btn--ghost" th:href="@{/orders/{id}(id=${order.id})}">返回订单详情</a>
                <a class="btn btn--ghost" th:href="@{/orders}">我的订单</a>
            </div>
        </section>
    </main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
