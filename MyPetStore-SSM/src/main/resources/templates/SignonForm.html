<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>账号登录 | MyPetStore</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/jpetstore.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="account-login-page">
<main class="account-login-shell">
    <section class="account-login-visual">
        <img th:src="@{/images/products/K9-BGL-03/1.jpg}" alt="温暖灯光下的比格犬">
        <div class="account-login-shade"></div>
        <a class="account-login-brand" th:href="@{/}"><img th:src="@{/images/logo.png}" alt=""><b>MyPetStore</b></a>
        <div class="account-login-copy">
            <span>WELCOME BACK</span>
            <h1>回来看看，<br>它正在等你。</h1>
            <p>登录后继续查看订单、管理个人资料，并把认真挑选的陪伴带回家。</p>
        </div>
        <div class="account-login-promise">
            <span><b>实时库存</b>商品状态来自数据库</span>
            <span><b>模拟支付</b>不会产生真实扣款</span>
        </div>
    </section>

    <section class="account-login-panel">
        <div class="account-login-form">
            <a class="account-login-mobile-brand" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="">
                <span><b>MyPetStore</b><small>陪它好好生活</small></span>
            </a>
            <div class="account-login-heading">
                <span>ACCOUNT LOGIN</span>
                <h2>账号登录</h2>
                <p>欢迎回来，请登录你的账户。</p>
            </div>

            <div class="flash flash--error" th:if="${error != null}" th:text="${error}">登录失败</div>
            <div class="flash flash--success" th:if="${message != null}" th:text="${message}">提示</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf}">
                <input type="hidden" name="returnUrl" th:if="${returnUrl != null}" th:value="${returnUrl}">
                <label class="account-field" for="username">
                    <span>用户名</span>
                    <input id="username" type="text" name="username" th:value="${username}" placeholder="请输入用户名"
                           autocomplete="username" required autofocus>
                </label>
                <label class="account-field" for="password">
                    <span>密码</span>
                    <input id="password" type="password" name="password" placeholder="请输入密码"
                           autocomplete="current-password" required>
                </label>
                <button type="submit" class="account-submit">登录并进入商城 <span>→</span></button>
            </form>

            <a class="account-guest-link" th:href="@{/main}">暂不登录，先逛逛商城 →</a>
            <p class="account-agreement">本站为课程实验项目，仅使用演示账号登录，不提供注册与第三方登录。</p>
        </div>
        <footer>© 2026 MyPetStore · 认真挑选每一份陪伴</footer>
    </section>
</main>
</body>
</html>
